name: Editorial redesign build validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'next.config.mjs'
      - 'tests/editorial-theme.test.mjs'
      - '.github/workflows/editorial-redesign-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editorial-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  editorial-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      LOCAL_CONTENT_FALLBACK: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify editorial theme, navigation and backup isolation
        run: node --test tests/editorial-theme.test.mjs
      - name: Compile Next.js production app
        run: npm run build
