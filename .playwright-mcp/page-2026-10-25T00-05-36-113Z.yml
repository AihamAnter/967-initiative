        - paragraph [ref=f48e32]: 967 مبادرة إعلامية ومجتمعية يمنية، تجمع المعرفة والحوار والمشاركة في مساحة مفتوحة لكل اليمنيين.
        - generic [ref=f48e33]:
          - heading "رؤيتنا ورسالتنا" [level=2] [ref=f48e34]
          - paragraph [ref=f48e35]: مجتمع أكثر وعياً ومشاركة، عبر المعرفة الواضحة والحوار المفتوح والعمل المشترك.
        - generic [ref=f48e36]:
