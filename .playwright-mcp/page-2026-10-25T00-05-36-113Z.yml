              - paragraph [ref=f48e45]: مؤسس مبادرة 967، يتولى الإشراف على رؤيتها وتوجهاتها العامة، وتطوير مشاريعها الإعلامية والمجتمعية، وتنسيق جهود فرق العمل. يسعى من خلال المبادرة إلى تعزيز الوعي المجتمعي، وتشجيع مشاركة الشباب في مناقشة قضايا اليمن والمساهمة في إيجاد حلول لها.
            - article [ref=f48e46]:
              - heading "عبدالرحمن" [level=3] [ref=f48e47]
              - strong [ref=f48e48]: مدير الإنتاج الإعلامي
              - paragraph [ref=f48e49]: يشرف على إنتاج المحتوى الإعلامي لمبادرة 967، بما يشمل البرامج المرئية والمقابلات والتقارير الميدانية. ويتولى تنسيق مراحل الإعداد والتصوير والمونتاج، والعمل مع الفريق لتقديم محتوى واضح وجذاب يعكس أهداف المبادرة.
            - article [ref=f48e50]:
              - heading "آية خالد" [level=3] [ref=f48e51]
              - strong [ref=f48e52]: مديرة مجلة 967
              - paragraph [ref=f48e53]: تتولى إدارة مجلة 967 والإشراف على إعداد أعدادها وتنظيم أقسامها ومحتواها التحريري. وتعمل على تنسيق مساهمات الكتّاب، ومراجعة المواد قبل نشرها، وتطوير المجلة لتكون مساحة معرفية وثقافية تطرح قضايا المجتمع اليمني بأسلوب مبسط ومتنوع.
