                - paragraph [ref=f7e675]: أبو بكر الماس ؛ مواليد 1 يوليو 1955 في جمهورية اليمن الديمقراطية الشعبية، عدن، هو لاعب كرة قدم يمني لعب لنادي التلال ومنتخب اليمن لكرة القدم كمهاجم. ويسجل أرشيف National Football Teams مشاركات له باسم منتخب اليمن الجنوبي قبل الوحدة، منها مباريات سنة 1988.
