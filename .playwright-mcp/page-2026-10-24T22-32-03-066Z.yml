                - paragraph [ref=f7e722]: إسراء جرجرة واين ملاكمة وُلدت في عدن في 16 سبتمبر 1971، وانتقلت مع أسرتها إلى كندا سنة 1974. مارست ألعابًا رياضية متعددة قبل أن تبدأ التدريب على الملاكمة سنة 1994، ثم انتقلت إلى الولايات المتحدة حيث خاضت مسيرتها الاحترافية. خاضت أول مباراة احترافية في لويزيانا يوم 14 فبراير 1995 أمام ديردري غوغارتي، وانتهت بخسارتها بالضربة الفنية القاضية في الجولة الثالثة.
