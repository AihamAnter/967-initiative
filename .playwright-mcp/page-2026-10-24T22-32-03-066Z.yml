                - paragraph [ref=f7e699]: علي محسن المريسي (16 سبتمبر 1940–26 نوفمبر 1993) هو لاعب كرة قدم،ولاعب القرن في اليمن الموحد في استفتاء رسمي جرى عام 2000م، ويعتبر من أشهر اللاعبين في تاريخ الكرة اليمنية وأنجح محترف مثل الكرة اليمنية في صفوف الزمالك المصري، وهو اللاعب الوحيد الذي لعب في منتخب مصر مع أنه لا يحمل الجنسية المصرية التي اعتذر عن قبولها بسبب حبه وولائه لليمن، وتشهد عدن كل سنة بطولة رمضانية لكرة القدم لأندية عدن والمحافظات المجاورة لها «لحج وأبين والضالع وتعز وحضرموت وشبوة» على كأس المريسي.
