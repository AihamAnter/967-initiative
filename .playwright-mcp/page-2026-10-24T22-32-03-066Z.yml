                - paragraph [ref=f7e745]: خالد بلعيد لاعب كرة قدم يمني وُلد في عدن يوم 2 نوفمبر 1986، ويشغل مركز خط الوسط. كان ضمن منتخب اليمن تحت 17 سنة الذي شارك في كأس العالم للناشئين سنة 2003 في فنلندا، بعد وصول المنتخب إلى نهائي بطولة آسيا للناشئين سنة 2002. تورد السيرة ضمن بطولات النادي التي شارك في مرحلتها الدوري اليمني لموسم 2004–2005، وكأس رئيس الجمهورية لسنتي 2007 و2010.
