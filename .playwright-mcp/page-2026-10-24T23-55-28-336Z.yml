            - heading "التعريف والمسيرة" [level=2] [ref=f36e295]
            - paragraph [ref=f36e296]:
              - text: أروى بنت أحمد الصليحي حاكمة يمنية من الدولة الصليحية، ارتبط حكمها بمدينة جبلة. مارست السلطة في أواخر القرن الحادي عشر والنصف الأول من القرن الثاني عشر الميلادي، وعُرفت في المصادر بلقب السيدة الحرة. تُدرس سيرتها في تاريخ الحكم والسياسة والعمران والدعوة الإسماعيلية في اليمن.
              - superscript [ref=f36e298]:
