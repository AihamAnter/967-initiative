                  - text: "[1]"
          - generic [ref=f36e300]:
            - heading "ولادتها" [level=2] [ref=f36e301]
            - paragraph [ref=f36e302]:
              - text: ولدت في مدينة جبلة وأمها رداح بنت الفارع بن موسى الصليحي زوجة المكرّم أحمد بن علي الصليحي ملك اليمن. ونشأت في رعاية أسماء بنت شهاب زوجة علي بن محمد الصليحي مؤسس الدولة الصليحية، بعد وفاة والدها أحمد الصليحي وزواج والدتها من عامر بن سليمان الزواحي.
              - superscript [ref=f36e304]:
                - 'link "المصدر 1: أروى بنت أحمد — السيرة الموسوعية" [ref=f36e305] [cursor=pointer]':
                  - /url: "#source-wikipedia"
                  - text: "[1]"
          - generic [ref=f36e306]:
            - heading "زواجها" [level=2] [ref=f36e307]
            - paragraph [ref=f36e308]:
              - text: تزوجها المكرّم أحمد بن علي سنة 458 هـ في حياة أبيه، وتولى الحكم من بعده (459 - 481 هـ) فأنجبت منه أربعة من الأولاد هم علي ومحمد وفاطمة وأم همدان وقد توفى علي ومحمد وهما طفلين سنة 467 هـ. أما أم همدان فقد تزوجت من أحمد بن سليمان بن عامر الزواحي ورزقت منه بعبد المستعلي وتوفيت قبل أمها سنة 516 هـ. وأما فاطمة فتزوجها شمس المعالي بن الراعي بن سبأ وتوفيت بعد والدتها بسنتين وذلك سنة 534 هـ.
              - superscript [ref=f36e310]:
                - 'link "المصدر 1: أروى بنت أحمد — السيرة الموسوعية" [ref=f36e311] [cursor=pointer]':
                  - /url: "#source-wikipedia"
                  - text: "[1]"
          - generic [ref=f36e312]:
            - heading "حكمها" [level=2] [ref=f36e313]
            - paragraph [ref=f36e314]: فوّض المكرم الأمور إِلى زوجته أروى، فكان أول ما قامت به، بعد أن غادرت صنعاء، أن اتخذت مقرها في قصر شيده زوجها في حصن بجبلة ونقل إِليه ذخائره وقامت بتدبير المملكة خير قيام وبسطت سلطانها على القبائل اليمانية، فخضع الناس لها، وكانت الرسائل التي يبعث بها المستنصر بالله الفاطمي إِلى اليمن تصدر باسمها.
            - paragraph [ref=f36e315]:
              - text: "وبعد وفاة زوجها المكرّم سنة 481هـ اختلف الصليحيون والزواحيون فيمن يتولى الحكم، وكان زوجها قد أوصى أن تسند أمور الدعوة إِلى الأمير المنصور سبأ بن أحمد بن المظفر الصليحي الذي طمح إِلى الزواج منها، فلم ترضَ أروى بهذا الاختيار، واحتكم سبأ إِلى المستنصر بالله الفاطمي الذي أمر أروى أن تقبل بسبأ زوجاً، وإن ظل هذا الزواج صورياً، وظلّت أروى تمسك بمقاليد الحكم الفعلية، وتُرفع إِليها الرقاع، ويجتمع عندها الوزراء، ويدعى لها على منابر اليمن، فيخطب أولاً للخليفة الفاطمي ثم لسبأ ابن أحمد ثم للسيدة الحرّة أروى. ولم تلبث أن استقلت بأمر الحكم بعد وفاة زوجها الثاني سبأ سنة 492هـ، واعتمدت في تدبير أمور الملك على عدد من الثقات، منهم: المفضّل بن أبي البركات، وزريع بن أبي الفضل، وعليّ بن إِبراهيم بن نجيب الدولة وغيرهم، وامتدت أيام حكمها بعد ذلك أربعين سنة، استطاعت في أثنائها أن تمارس سيادتها على الإِمارات اليمنية الصغيرة من دون إِخضاعها."
              - superscript [ref=f36e317]:
                - 'link "المصدر 1: أروى بنت أحمد — السيرة الموسوعية" [ref=f36e318] [cursor=pointer]':
                  - /url: "#source-wikipedia"
                  - text: "[1]"
          - generic [ref=f36e319]:
            - heading "وفاتها" [level=2] [ref=f36e320]
            - paragraph [ref=f36e321]: "عمرت أروى طويلاً، فلمّا ماتت دفنت في مسجد كانت بنته بذي جبلة، وقبرها ما يزال حتى اليوم مزارًا. وعلى إِثر وفاتها دبّ الضعف في جسد الدولة الصليحية وتفككت أوصالها وصار الأمر فيها إِلى الأمراء من آل زريع، وانتهى أمر الصليحيين تماماً بعد أن غزا توران شاه بن أيوب اليمن سنة 569 هـ. مدحها الشاعر ابن القم بأبيات شهيرة:"
            - paragraph [ref=f36e322]: أعلمت أن من الرماح قدودا *** ومن الصّفاح محاجرا ونهوداً
            - paragraph [ref=f36e323]: أعلى الأنام أبا وأكرم طينة *** وأتمّ أعراقا وأصلب عوداً
            - paragraph [ref=f36e324]: لو كان يعبد للجلالة في الورى *** بشر لكانت ذلك المعبودا
            - paragraph [ref=f36e325]: هي نعمة الله التي ما ماؤها *** ثمداً ولا معروفها مجحودا
            - paragraph [ref=f36e326]: هي رحمة الله التي ما زال من *** فوق البرية ظلها ممدودا
            - paragraph [ref=f36e327]: "كما مدح علمها الشاعر محمد أحمد منصور :"
            - paragraph [ref=f36e328]: تلك أروى، خليفة الله في *** الأرض، ولله مثلها الخلفاء
            - paragraph [ref=f36e329]: صنعت للبلاد ماعجزت بالامس*** عنه، العمائم البيضاء
            - paragraph [ref=f36e330]: ليت أهل اللحى الطويلة تبني *** مابنته الضفائر السوداء
            - paragraph [ref=f36e331]: كم أقامت مدارساً شامخات*** نهلت من علومها الأبناءُ
