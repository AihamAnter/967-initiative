          - paragraph [ref=f36e255]: أروى بنت أحمد الصليحي حاكمة يمنية من الدولة الصليحية، ارتبط حكمها بمدينة جبلة. مارست السلطة في أواخر القرن الحادي عشر والنصف الأول من القرن الثاني عشر الميلادي، وعُرفت في المصادر بلقب السيدة الحرة. تُدرس سيرتها في تاريخ الحكم والسياسة والعمران والدعوة الإسماعيلية في اليمن. ولدت في مدينة جبلة وأمها رداح بنت الفارع بن موسى الصليحي زوجة المكرّم أحمد بن علي الصليحي ملك اليمن.
