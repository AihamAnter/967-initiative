              - link "هل يجب أن تصبح الخدمات الحكومية في اليمن رقمية بالكامل خلال خمس سنوات؟" [ref=f20e61] [cursor=pointer]:
                - /url: /debates/yemen-digital-services-test
            - paragraph [ref=f20e62]: هل ينبغي لليمن أن يتجه نحو رقمنة جميع الخدمات الحكومية خلال خمس سنوات، أم أن الإبقاء على الخدمات الحضورية إلى جانب الرقمية هو الخيار الأنسب في ظل الظروف الحالية؟
            - generic [ref=f20e63]:
              - generic [ref=f20e64]:
                - text: د. سامر المعافري
                - generic [ref=f20e65]: أرى أن اليمن يجب أن يضع خطة وطنية للانتقال إلى الخدمات الحكومية الرقمية خلال خمس سنوات، مع مراحل تنفيذ واضحة. فالاستمرار في الاعتماد على المعاملات الورقية يستهلك الوقت والموارد، ويزيد احتمالات الأخطاء والوساطة. يمكن البدء بالخدمات الأكثر استخداماً، مع تدريب الموظفين وتوفير مراكز مساعدة للفئات التي تحتاج دعماً
              - generic [ref=f20e66]:
                - text: م. هدى السقاف
                - generic [ref=f20e67]: التحول الرقمي مهم، لكن تحويل جميع الخدمات إلى خدمات إلكترونية حصراً خلال خمس سنوات قد يخلق عوائق جديدة أمام المواطنين. فضعف الكهرباء والاتصالات وصعوبة امتلاك بعض الأجهزة يجعل الاحتفاظ بمكاتب خدمة حضورية أمراً ضرورياً. الأنسب هو نظام هجين يوفر المعاملة إلكترونياً لمن يستطيع استخدامها، ويحتفظ بحق الوصول المباشر لمن يحتاجه
