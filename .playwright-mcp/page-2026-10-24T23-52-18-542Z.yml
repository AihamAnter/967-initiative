                - heading "وهب بن منبه" [level=3] [ref=f29e451]
                - strong [ref=f29e452]: مؤرخ وراوية يمني
                - paragraph [ref=f29e453]: "أَبُو عَبْدِ اللَّهِ وَهْبُ بْنُ مُنَبِّهِ بْنِ كَامِلِ بْنِ سِيجِ بْنِ ذِي كِبَارٍ الْأَبْنَاوِيُّ الْيَمَانِيُّ الذِّمَارِيُّ الصَّنْعَانِيُّ (34 هـ - 110 هـ أو 114 هـ) هو تابعي جليل، له معرفة بكتب الأوائل وإخباري قصصي يُعد من أقدم من كتب في الإسلام. كان ممن قرأ الكُتب ولزم العبادة وواظب على العلم وتجرد للزهد. وعدّه ابن سعد في الطبقة الثانية من محدّثي اليمن بعد الصحابة. قال الذهبي عنه: «ورِوايته للمسند قليلة، وإنما غَزارة علمه في الإسرائيليات، ومن صَحائف أهل الكتاب». روى له البخاري ومسلم وأبو داود والترمذي والنسائي ومحمد بن ماجه. وقال الذهبي: «لا شيء في الصحيحين لوهب بن منبه سوى حديث واحد»."
