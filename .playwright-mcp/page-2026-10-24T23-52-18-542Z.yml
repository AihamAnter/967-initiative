                - paragraph [ref=f29e398]: "نَشْوَانُ بْنُ سَعِيدٍ ٱلْحِمْيَرِيُّ (نحو 500 هـ - 573 هـ / 1107م - 1178 م): قاضٍ، سياسي، لُغَوي، مؤرخ، أديب، يمانٍ (يمني)، اقترب في فكره من فكر المعتزلة، وكتب في تاريخ ملوك حمير، والدين، واللغة، كان له طموح في السياسة، وحكم في بعض سنين عمره، عُرف بفخره بيمانِيَتِه وإنكارِ حصر الإمامة في البطنين أو في قريش والرد عليها وله في ذلك كثير من النقاشات مع الأئمة الزيدية في عهده."
