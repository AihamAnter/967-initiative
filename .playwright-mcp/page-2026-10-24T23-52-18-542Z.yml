                - paragraph [ref=f29e531]: "يوسف أسأر يثأر الحميري ، المعروف في المصادر العربية باسم زرعة ذي نواس، وفي السريانية مسروق، وفي اليونانية دوناس (تـ بين 525 و530م): آخر ملوك مملكة حمير المستقلة وآخر ملوكها اليهود، تولى الحكم في يونيو 522م ملكًا تابعًا لـمملكة أكسوم، ثم ثار عليها في خريف السنة نفسها، وقمع ثورة مسيحيي نجران في نوفمبر 523م، فكانت ذريعة لحملة النجاشي كالب على اليمن، التي قُتل فيها يوسف وانتهى بمقتله غرقاً في البحر استقلال حمير. ويرى كريستيان روبان أن هذا اللقب إما لقب جديد أراد به يوسف أن يجمع أنصاره في كيان سياسي جديد، وإما لقب مؤقت ريثما يقرّ مجلس الأقيال ملكه، في حين عاد أبرهة بعده إلى اللقب الملكي الحميري الطويل (النقشان: DAI GDN 2002-20 وCIH 541)."
