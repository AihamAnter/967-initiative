                - paragraph [ref=f29e560]: "كرب إيل وتر بن ذمار علي (تـ 650 ق م): أشهر مكاربة سبأ، ويعد المؤسس الفعلي لمملكة سبأ ومنظمها. وقد افتتح هذا المكرب عهده بإرسال هدايا إلى آشور، وهو أول حاكم سبئي اعترف به الآشوريون بوصفه ملكاً وحاكماً، ووفقاً لنقش أثري خاص للملك سنحاريب في ذكرى انشاء المعبد في رأس السنة الآشورية عام 685 ق م أو 682 ق م، قدم (كربئيلو ملك سبأ) هبة تتضمن أحجار كريمة وتوابل بهذه المناسبة. وعلل فرتز هومل إطلاق لقب ملك على كرب إيل في هذا النقش بأن الآشوريين لم يهتموا كثيراً بألقاب هؤلاء الأمراء البعيدين، ولذلك دعوا مكربا \"ملكاً\". وعلى الرغم من كل الانتصارات العسكرية التي نجح فيها سلفه المكرب السبئي يثع أمر وتر بن يكرب ملك على النطاق الداخلي في جنوبي جزيرة العرب، فإنه"
