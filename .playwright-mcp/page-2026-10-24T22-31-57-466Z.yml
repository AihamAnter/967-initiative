                - heading "عبد ربه منصور هادي" [level=3] [ref=f7e451]
                - strong [ref=f7e452]: رئيس الجمهورية اليمنية منذ سنة 2012 إلى سنة 2022
                - paragraph [ref=f7e453]: انتُخب رئيسًا للبلاد عام 2012 وكان مرشَّحًا توافقيًّا وحيدًا، أجمع عليه حزب المؤتمر الشعبي العام وأحزاب تكتُّل اللقاء المشترك بعد أحداث 2011 التي سمِّيت ثورة الشباب. أجرى هادي عملية لهيكلة الجيش اليمني والأمن بإقالة العشرات من القادة العسكريين الموالين لسلفه الرئيس السابق علي عبد الله صالح، و علي محسن الأحمر، وإعادة تنظيم وتوزيع الوحَدات العسكرية والأمنية. وعلَّل هادي إعادةَ بناء الجيش على أسُس وطنية أنه يكفُل حياديته وعدم دخوله طرفًا في الصراعات السياسية.
