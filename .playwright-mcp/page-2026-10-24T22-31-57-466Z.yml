                - paragraph [ref=f7e543]: ولد عوض أحمد علي أبو بكر همام في قرية المحل قرب زنجبار بأبين. فقد والده رضيعاً وتولت والدته تربيته، ويربط حديثه عن البدايات بين موهبته وصوتها الجميل الذي سمعه في البيت. بدأ الغناء في المدرسة والشارع، وكان يردد أغاني محمد صالح حمدون، ثم انتقل من هذا التدريب الفطري إلى الغناء أمام جمهور المناسبات. تورد السيرة التفصيلية في عدن الغد سنة 1947 للميلاد، بينما تصف 14 أكتوبر ميلاده بأنه في أواخر الأربعينيات.
