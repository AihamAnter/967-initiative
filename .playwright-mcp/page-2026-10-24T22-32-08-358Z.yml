                - paragraph [ref=f7e1298]: أمة العليم علي السوسوة وزيرة، إعلامية، دبلوماسية، وباحثة يمنية من عائلة بيت السوسوة مدينة ذمار. ولدت في مدينة تعز عام 1958م، ثم استقرّت في مدينة صنعاء. حصلت على شهادة الثانوية العامة سنة 1396ه‍/1976م، ثم التحقت بالعمل في إذاعة تعز، ثم انتقلت إلى تلفزيون صنعاء، وأصبحت كبير المذيعين فيه، وفي عام 1411ه‍/1991م، عُيّنت وكيلاً مساعدًا في وزارة الإعلام، كما عُيّنت سنة 1417ه‍/1997م، في المنصب نفسه، ثم عينت ممثلاً دائمًا لليمن لدى منظمة حظر الأسلحة الكيماوية في هولندا، ثم سفيرة غير مقيمة لدى مملكة السويد، ثم سفيرة غير مقيمة لدى مملكة الدنمارك، ثم سفيرة لدى مملكة هولندا، ثم وزيراً لحقوق الإنسان. كما عملت في الأمم المتحدة كمساعدة للأمين العام للأمم…
