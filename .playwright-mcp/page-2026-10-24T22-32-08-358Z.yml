                - paragraph [ref=f7e1158]: أيوب طارش عبسي مغنٍ وملحن يمني وُلد سنة 1942 في منطقة الأعبوس بمحافظة تعز. ارتبط اسمه بالأغنية اليمنية وبالتعاون مع شعراء منهم عبد الله عبد الوهاب نعمان، المعروف بالفضول. ومن أشهر أعماله لحن النشيد الوطني للجمهورية اليمنية. وتذكر سيرته أغنية بالله عليك وا مسافر من كلمـات أخيه محمد بن طارش ولحنه، ووصول تسجيله إلى إذاعة تعز سنة 1956.
