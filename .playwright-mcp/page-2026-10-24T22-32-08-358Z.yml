                - paragraph [ref=f7e1135]: صبري الحيقي (25 ديسمبر 1961 -)؛ فنان تشكيلي، شاعر، ناقد وباحث يمني. بدأ الكتابة في 1978 في صحيفة الجمهورية الرسمية وكان له عمود في الصفحة الأخيرة بأسم (هواجس) وقد رسم أكثر من مرة كاريكاتير الصفحة الأخيرة في نفس الصحيفة، واستمر في الكتابات النقدية والشعرية اثناء دراسته في تعز حيث اكمل دراسته إلى ثاني ثانوي، وبعد ذلك حصل على وظيفة في وزارة الثقافة وانتقل إلى صنعاء 1980 وهناك اكمل دراسة الثانوية العامة في صنعاء موظفا في الصباح دارسا في الفترة المسائية، محررا فنيا في صحيفة الثورة الرسمية.
