                - paragraph [ref=f7e1088]: أحمد بن علوان هو إمام الصوفية وفيلسوفهم في عصر الدولة الرسولية في اليمن، نشأ في أحضان الرئاسة والعلم، وكان والده في خدمة السلطان ومن كتابه، وكاد الشيخ أن ينتهج طريق والده في خدمة السلطان، إلا انه تحول إلى طريق التصوف تحت تأثير خارق، ولزم الخلوة والعبادة، واشتهر بحب الوعظ، فقد كان يسلك في وعظه طريقة ابن الجوزي حتى لقب بجوزي اليمن، وله رسائل كثيرة ومؤلفات جمعت في مجلدات منها كتاب (الفتوح المصونة والأسرار المخزونة)، فضلاً عن ديوانه الشعري الذي جاء أغلبه في التصوف، وبعد أن توفي صار لضريحه مكانة مقدسة وتقام زيارة سنوية له في منتصف شهر ربيع الأول من كل عام، سمتها المصادر التاريخية باسم (يوم الجمع المبارك).
                - generic [ref=f7e1090]:
